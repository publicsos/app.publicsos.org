name: Build and Test Docker Image

on:
  push:
    branches:
      - "release/001"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install Dependencies
        run: composer install --no-progress --no-suggest --prefer-dist --optimize-autoloader
        working-directory: application-domain/php

      - name: Set up Environment
        run: |
          # Create .env file with secrets or default values
          echo "APP_NAME=${{ secrets.APP_NAME || 'LaravelApp' }}" >> .env
          echo "APP_ENV=${{ secrets.APP_ENV || 'local' }}" >> .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "APP_DEBUG=${{ secrets.APP_DEBUG || 'true' }}" >> .env
          echo "APP_URL=${{ secrets.APP_URL || 'http://localhost' }}" >> .env
          echo "DB_CONNECTION=${{ secrets.DB_CONNECTION || 'sqlite' }}" >> .env
          echo "DB_HOST=${{ secrets.DB_HOST || '127.0.0.1' }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT || '3306' }}" >> .env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE || 'testing' }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME || 'root' }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || '' }}" >> .env
          echo "CACHE_DRIVER=${{ secrets.CACHE_DRIVER || 'file' }}" >> .env
          echo "SESSION_DRIVER=${{ secrets.SESSION_DRIVER || 'file' }}" >> .env
          echo "QUEUE_CONNECTION=${{ secrets.QUEUE_CONNECTION || 'sync' }}" >> .env

          # Generate application key if missing
          if [ -z "${{ secrets.APP_KEY }}" ]; then
            php artisan key:generate --force
          fi
          
          # Display .env file for debugging
          echo "Generated .env file:"
          cat .env

          # Clear Laravel cache and config
          php artisan config:clear
          php artisan cache:clear
          php artisan config:cache

          # Ensure database service is ready
          echo "Waiting for database to be ready..."
          sleep 10  # Adjust this based on DB start time

          # Set up SQLite DB for testing (if applicable)
          touch database/testing.sqlite

          # Run migrations
          php artisan migrate:fresh --seed --force
        working-directory: application-domain/php

      - name: Run Tests
        run: php artisan test
        working-directory: application-domain/php

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v3
        with:
          context: application-domain/php
          platforms: linux/amd64
          push: true
          tags: izdrail/publicsos.org:dev
